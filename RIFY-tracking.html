<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sales Trend & Delta Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-950 text-white p-6">
    <div class="max-w-6xl mx-auto">
      <header class="flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold tracking-tight">
          Sales Analytics <span class="text-blue-500">Live</span>
        </h1>
        <div id="last-run" class="text-xs text-gray-500 font-mono"></div>
      </header>

      <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl mb-8">
        <canvas id="mainChart" height="300"></canvas>
      </div>

      <div
        id="seat-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"
      ></div>
    </div>

    <script>
      async function loadDashboard() {
        const res = await fetch('data.json');
        const db = await res.json();
        const history = db.history;
        const latest = history[history.length - 1];

        document.getElementById('last-run').innerText =
          `UPDATED: ${new Date(latest.timestamp).toLocaleString()}`;

        // 1. Chart Logic (Date + Time)
        const ctx = document.getElementById('mainChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: history.map((h) => {
              const d = new Date(h.timestamp);
              // Returns "May 12, 11:30"
              return (
                d.toLocaleDateString([], { month: 'short', day: 'numeric' }) +
                ' ' +
                d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              );
            }),
            datasets: [
              {
                label: 'Sold Tickets',
                data: history.map((h) => h.totalSold),
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                fill: true,
                tension: 0.3,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                ticks: { color: '#666', font: { size: 10 } },
                grid: { display: false },
              },
              y: { ticks: { color: '#666' }, grid: { color: '#1f2937' } },
            },
          },
        });

        // 2. Grid Logic (Increase Badge)
        const grid = document.getElementById('seat-grid');
        Object.keys(latest.byType).forEach((name) => {
          const type = latest.byType[name];
          const pct = ((type.sold / type.total) * 100).toFixed(1);
          const inc = type.increase || 0;

          grid.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl relative overflow-hidden">
                        ${inc > 0 ? `<div class="absolute top-3 right-3 bg-green-500/20 text-green-400 text-[10px] font-bold px-2 py-0.5 rounded-full animate-pulse">+${inc} NEW</div>` : ''}
                        
                        <h3 class="text-gray-500 text-[10px] font-black uppercase tracking-wider mb-2">${name}</h3>
                        <div class="flex items-baseline gap-2">
                            <span class="text-2xl font-bold">${type.sold}</span>
                            <span class="text-gray-600 text-xs">/ ${type.total}</span>
                        </div>
                        
                        <div class="mt-4 flex justify-between items-center">
                            <div class="w-full bg-gray-800 h-1.5 rounded-full mr-3">
                                <div class="h-full rounded-full" style="width: ${pct}%; background: ${type.color}"></div>
                            </div>
                            <span class="text-[10px] font-bold" style="color: ${type.color}">${pct}%</span>
                        </div>
                    </div>`;
        });
      }
      loadDashboard();
    </script>
  </body>
</html>
