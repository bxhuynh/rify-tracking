<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sales Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-950 text-white p-6 font-sans">
    <div class="max-w-7xl mx-auto">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div
          class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl"
        >
          <p
            class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-1"
          >
            Total Sales Percentage
          </p>
          <div class="flex items-end gap-3">
            <span id="global-pct" class="text-5xl font-black text-blue-500"
              >0%</span
            >
            <span
              id="global-inc"
              class="text-green-400 text-sm font-bold mb-2"
            ></span>
          </div>
        </div>
        <div
          class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl md:col-span-2 flex items-center justify-between"
        >
          <div>
            <p
              class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-1"
            >
              Overall Capacity
            </p>
            <span id="global-count" class="text-3xl font-bold text-white"
              >0 / 0</span
            >
          </div>
          <div class="text-right">
            <p
              class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-1"
            >
              Last Updated
            </p>
            <span id="last-run" class="text-sm font-mono text-gray-400 italic"
              >--:--</span
            >
          </div>
        </div>
      </div>

      <div
        class="bg-gray-900 border border-gray-800 p-6 rounded-3xl mb-8 shadow-2xl"
      >
        <h3
          class="text-gray-400 text-xs font-bold uppercase mb-6 tracking-widest"
        >
          Sales Trend Over Time (Date & Time)
        </h3>
        <div class="h-[350px]">
          <canvas id="mainChart"></canvas>
        </div>
      </div>

      <div
        id="seat-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5"
      ></div>
    </div>

    <script>
      async function loadDashboard() {
        const res = await fetch('data.json');
        const db = await res.json();
        const history = db.history;
        const latest = history[history.length - 1];

        // 1. Global Summaries
        const totalPct = (
          (latest.totalSold / latest.totalCapacity) *
          100
        ).toFixed(1);
        document.getElementById('global-pct').innerText = totalPct + '%';
        document.getElementById('global-count').innerText =
          `${latest.totalSold.toLocaleString()} / ${latest.totalCapacity.toLocaleString()}`;
        document.getElementById('last-run').innerText = new Date(
          latest.timestamp,
        ).toLocaleString();

        if (latest.totalIncrease > 0) {
          document.getElementById('global-inc').innerText =
            `▲ +${latest.totalIncrease} since last`;
        }

        // 2. Charting (Date + Time Labels)
        const ctx = document.getElementById('mainChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: history.map((h) => {
              const d = new Date(h.timestamp);
              return (
                d.toLocaleDateString([], { month: 'short', day: 'numeric' }) +
                ' ' +
                d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              );
            }),
            datasets: [
              {
                label: 'Sold',
                data: history.map((h) => h.totalSold),
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                fill: true,
                tension: 0.4,
                pointRadius: 6,
                pointHoverRadius: 8,
                pointBackgroundColor: '#3b82f6',
                borderWidth: 3,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: {
                ticks: { color: '#4b5563', font: { size: 10 } },
                grid: { display: false },
              },
              y: { ticks: { color: '#4b5563' }, grid: { color: '#1f2937' } },
            },
          },
        });

        // 3. Grid Rendering
        const grid = document.getElementById('seat-grid');
        Object.keys(latest.byType).forEach((name) => {
          const type = latest.byType[name];
          const pct = ((type.sold / type.total) * 100).toFixed(1);
          const inc = type.increase || 0;

          grid.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl relative overflow-hidden transition hover:border-gray-700">
                        ${inc > 0 ? `<div class="absolute top-4 right-4 bg-green-500 text-black text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-tighter">+${inc} NEW</div>` : ''}
                        
                        <h3 class="text-gray-500 text-[10px] font-black uppercase tracking-widest mb-3">${name}</h3>
                        <div class="flex items-baseline gap-2 mb-4">
                            <span class="text-3xl font-bold">${type.sold}</span>
                            <span class="text-gray-600 text-sm">/ ${type.total}</span>
                        </div>
                        
                        <div class="flex justify-between items-center text-[10px] font-bold mb-1">
                            <span style="color: ${type.color}">${pct}% SOLD</span>
                        </div>
                        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-1000" style="width: ${pct}%; background: ${type.color}"></div>
                        </div>
                    </div>`;
        });
      }
      loadDashboard();
    </script>
  </body>
</html>
