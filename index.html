<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RIFY Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .matrix-container::-webkit-scrollbar {
        height: 8px;
      }
      .matrix-container::-webkit-scrollbar-track {
        background: #0f172a;
      }
      .matrix-container::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white p-6 font-sans">
    <div class="max-w-[1600px] mx-auto">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div
          class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl"
        >
          <p
            class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-1"
          >
            Total Progress
          </p>
          <div id="stat-pct" class="text-5xl font-black text-blue-500 italic">
            0%
          </div>
        </div>
        <div
          class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl"
        >
          <p
            class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-1"
          >
            Sold / Capacity
          </p>
          <div
            id="stat-total"
            class="text-3xl font-bold text-white mt-2 font-mono"
          >
            0 / 0
          </div>
        </div>
        <div
          class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl"
        >
          <p
            class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-1"
          >
            Latest Increase
          </p>
          <div id="stat-delta" class="text-3xl font-bold text-green-400 mt-2">
            +0
          </div>
        </div>
        <div
          class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl flex flex-col justify-center"
        >
          <p
            class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-1"
          >
            Last Hourly Check (ICT)
          </p>
          <p id="stat-time" class="text-slate-300 text-sm font-mono italic">
            --:--:--
          </p>
        </div>
      </div>

      <div class="mb-8">
        <div
          class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl h-[480px]"
        >
          <div class="flex justify-between items-center mb-6">
            <h3
              class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em]"
            >
              Daily Sales Velocity Trend (Vietnam Time)
            </h3>
            <span
              class="text-[10px] text-slate-600 bg-slate-950 px-3 py-1 rounded-full font-mono"
              >Filtered: 1 Point / Day</span
            >
          </div>
          <div class="h-[360px]">
            <canvas id="mainChart"></canvas>
          </div>
        </div>
      </div>

      <div class="mb-10">
        <h3
          class="text-slate-500 text-[10px] font-black uppercase tracking-[0.2em] mb-6 pl-1"
        >
          Live Inventory Breakdown
        </h3>
        <div
          id="seat-grid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
        ></div>
      </div>

      <div
        class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl"
      >
        <div
          class="px-6 py-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center"
        >
          <h3
            class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400"
          >
            Increase Matrix (Daily Progression - ICT)
          </h3>
        </div>
        <div class="overflow-x-auto matrix-container">
          <table class="w-full text-left text-[11px] border-collapse">
            <thead>
              <tr
                id="matrix-head"
                class="bg-slate-950/50 text-slate-500 uppercase tracking-tighter border-b border-slate-800"
              >
                <th
                  class="p-5 sticky left-0 bg-slate-950 z-20 border-r border-slate-800"
                >
                  Date
                </th>
                <th
                  class="p-5 font-black text-white bg-slate-800/80 sticky right-0 z-20 border-l border-slate-700"
                >
                  DAILY DELTA
                </th>
              </tr>
            </thead>
            <tbody id="matrix-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      async function initDashboard() {
        const res = await fetch('./data.json');
        const db = await res.json();
        const rawHistory = db.history;

        if (!rawHistory || rawHistory.length === 0) return;

        const latestHourly = rawHistory[rawHistory.length - 1];
        const previousHourly = rawHistory[rawHistory.length - 2];

        // --- FILTER LOGIC: Group entries by Vietnam Calendar Date (UTC+7) ---
        const dailyMap = new Map();
        rawHistory.forEach((entry) => {
          const dateObj = new Date(entry.timestamp);
          const vnDateKey = dateObj.toLocaleDateString('fr-CA', {
            timeZone: 'Asia/Ho_Chi_Minh',
          });
          dailyMap.set(vnDateKey, entry);
        });
        const dailyHistory = Array.from(dailyMap.values());

        const typeNames = [
          ...new Set(rawHistory.flatMap((h) => Object.keys(h.byType))),
        ].sort();

        // 1. Build Matrix Table Dynamic Headers
        const head = document.getElementById('matrix-head');
        const totalHeader = head.lastElementChild;
        typeNames.forEach((name) => {
          const th = document.createElement('th');
          th.className =
            'p-5 font-bold border-r border-slate-800/30 min-w-[130px]';
          th.innerText = name.replace('(Gift)', '').trim();
          head.insertBefore(th, totalHeader);
        });

        // 2. Build Daily Matrix Table Rows (Newest Day First)
        const body = document.getElementById('matrix-body');
        for (let i = dailyHistory.length - 1; i >= 0; i--) {
          const cur = dailyHistory[i];
          const prev = dailyHistory[i - 1];
          const tr = document.createElement('tr');
          tr.className =
            'border-b border-slate-800/50 hover:bg-slate-800/40 transition group';

          const dateObj = new Date(cur.timestamp);
          const dateStr = dateObj.toLocaleDateString('en-US', {
            timeZone: 'Asia/Ho_Chi_Minh',
            weekday: 'short',
            month: 'short',
            day: 'numeric',
          });
          const timeStr = dateObj.toLocaleTimeString('en-US', {
            timeZone: 'Asia/Ho_Chi_Minh',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          });

          let rowHtml = `<td class="p-5 font-mono text-slate-400 sticky left-0 bg-slate-950 border-r border-slate-800 z-10 group-hover:text-white transition">
                                <span class="text-white font-medium">${dateStr}</span> 
                                <span class="text-slate-600 text-[10px] ml-1">(${timeStr})</span>
                               </td>`;

          typeNames.forEach((name) => {
            const currentSold = cur.byType[name]?.sold || 0;
            // FIXED: If prev day doesn't exist, compare against 0 instead of showing empty marker
            const previousSold = prev ? prev.byType[name]?.sold || 0 : 0;
            const diff = currentSold - previousSold;

            rowHtml += `<td class="p-5 font-bold ${diff > 0 ? 'text-green-400 bg-green-400/5' : 'text-slate-700'}">${diff > 0 ? '+' + diff : '•'}</td>`;
          });

          // FIXED: Handle total delta for day 1 comparing against 0
          const prevTotalSold = prev ? prev.totalSold : 0;
          const totalDiff = cur.totalSold - prevTotalSold;

          rowHtml += `<td class="p-5 font-black bg-slate-900/80 sticky right-0 z-10 border-l border-slate-700 ${totalDiff > 0 ? 'text-blue-400' : 'text-slate-600'}">${totalDiff > 0 ? '+' + totalDiff : '0'}</td>`;
          tr.innerHTML = rowHtml;
          body.appendChild(tr);
        }

        // 3. Render Top Metrics (Using actual live hour data)
        document.getElementById('stat-pct').innerText =
          ((latestHourly.totalSold / latestHourly.totalCapacity) * 100).toFixed(
            1,
          ) + '%';
        document.getElementById('stat-total').innerText =
          `${latestHourly.totalSold.toLocaleString()} / ${latestHourly.totalCapacity.toLocaleString()}`;

        // FIXED: If there is no previous hourly snapshot yet, show current total as increase
        const hourlyDelta = previousHourly
          ? latestHourly.totalSold - previousHourly.totalSold
          : latestHourly.totalSold;
        document.getElementById('stat-delta').innerText = `+${hourlyDelta}`;

        document.getElementById('stat-time').innerText = new Date(
          latestHourly.timestamp,
        ).toLocaleTimeString('en-US', {
          timeZone: 'Asia/Ho_Chi_Minh',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
        });

        // 4. Daily Line Chart Implementation
        new Chart(document.getElementById('mainChart'), {
          type: 'line',
          data: {
            labels: dailyHistory.map((h) => {
              const d = new Date(h.timestamp);
              const dStr = d.toLocaleDateString('en-US', {
                timeZone: 'Asia/Ho_Chi_Minh',
                month: 'short',
                day: 'numeric',
              });
              const tStr = d.toLocaleTimeString('en-US', {
                timeZone: 'Asia/Ho_Chi_Minh',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false,
              });
              return `${dStr} (${tStr})`;
            }),
            datasets: [
              {
                data: dailyHistory.map((h) => h.totalSold),
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.05)',
                fill: true,
                tension: 0,
                borderWidth: 4,
                pointRadius: 6,
                pointBackgroundColor: '#3b82f6',
                pointBorderColor: '#0f172a',
                pointBorderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: {
                grid: { color: 'rgba(255,255,255,0.03)' },
                ticks: { color: '#64748b', font: { size: 10 } },
              },
              y: {
                grid: { color: 'rgba(255,255,255,0.03)' },
                ticks: { color: '#64748b' },
              },
            },
          },
        });

        // 5. Live Card Grids (Hourly context status)
        const grid = document.getElementById('seat-grid');
        typeNames.forEach((name) => {
          const t = latestHourly.byType[name];
          const inc = previousHourly
            ? t.sold - (previousHourly.byType[name]?.sold || 0)
            : t.sold;
          const pct = ((t.sold / t.total) * 100).toFixed(1);

          grid.innerHTML += `
                    <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 relative shadow-xl">
                        ${inc > 0 ? `<div class="absolute top-6 right-6 bg-green-500 text-black text-[10px] font-black px-2 py-1 rounded-lg animate-pulse">+${inc} LIVE</div>` : ''}
                        <div class="text-[11px] text-slate-500 uppercase font-black mb-4 truncate">${name}</div>
                        <div class="flex justify-between items-end mb-2">
                            <div class="text-4xl font-black">${t.sold}<span class="text-slate-600 text-lg font-normal ml-1">/${t.total}</span></div>
                            <div class="text-xl font-black italic" style="color: ${t.color}">${pct}%</div>
                        </div>
                        <div class="w-full bg-slate-950 h-3 mt-4 rounded-full overflow-hidden p-[2px]">
                            <div class="h-full rounded-full" style="width:${pct}%; background:${t.color}"></div>
                        </div>
                    </div>`;
        });
      }
      initDashboard();
    </script>
  </body>
</html>
